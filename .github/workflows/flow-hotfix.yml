name: flow-hotfix

# push em hotfix/**: pipeline de emergência (SAST não bloqueante) → PRs para develop e main
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  config:
    uses: ./.github/workflows/config.yml
    with:
      environment: prod

  ci:
    needs: config
    uses: ./.github/workflows/ci.yml
    with:
      advpipes: ${{ needs.config.outputs.advpipes }}

  iac-scan:
    needs: [config, ci]
    uses: ./.github/workflows/iac-scan.yml
    with:
      advpipes: ${{ needs.config.outputs.advpipes }}

  helm-lint:
    needs: [config, ci]
    runs-on: ubuntu-latest
    steps:
      - run: echo "⎈ [SIMULADO] helm lint charts/"

  sast-non-blocking:
    needs: [config, ci]
    uses: ./.github/workflows/sast.yml
    with:
      advpipes: ${{ needs.config.outputs.advpipes }}
      non-blocking: true

  build-package:
    needs: [config, iac-scan, helm-lint, sast-non-blocking]
    uses: ./.github/workflows/package.yml
    with:
      mode: build
      advpipes: ${{ needs.config.outputs.advpipes }}
      environment: prod

  build-image:
    needs: build-package
    uses: ./.github/workflows/image.yml
    with:
      mode: build
      version: ${{ needs.build-package.outputs.artifact-version }}
      environment: prod

  rc-tag:
    needs: [build-package, build-image]
    uses: ./.github/workflows/tag.yml
    with:
      mode: rc
      version: ${{ needs.build-package.outputs.artifact-version }}
      note: "Hotfix publicado (pacote pronto para promoção direta em PROD)"

  open-pr-to-develop:
    needs: [build-package, rc-tag]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/open-pr.yml
    secrets: inherit
    with:
      base: develop
      head: ${{ github.ref_name }}
      title: "[DEV] Hotfix ${{ github.ref_name }} → develop"
      body: "Traz o hotfix para o develop. Aguardando revisão e aprovação humana."

  compose-main-body:
    needs: build-package
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.b.outputs.body }}
    env:
      VERSION: ${{ needs.build-package.outputs.artifact-version }}
    steps:
      - id: b
        run: |
          {
            echo "body<<EOF_BODY"
            echo "Hotfix $VERSION (SAST não bloqueante)."
            echo
            echo "Para aprovar o deploy em PROD, **edite este PR** marcando o checkbox:"
            echo
            echo "- [ ] Aprovar deploy em PROD"
            echo
            echo "<!-- artifact-version:$VERSION -->"
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

  open-pr-to-main:
    needs: [build-package, rc-tag, compose-main-body]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/open-pr.yml
    secrets: inherit
    with:
      base: main
      head: ${{ github.ref_name }}
      title: "[PROD] Hotfix ${{ github.ref_name }} → main"
      body: ${{ needs.compose-main-body.outputs.body }}
