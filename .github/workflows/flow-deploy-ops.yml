name: flow-deploy-ops

# Issue aberta (label canary|rollback): lê o Issue Form (campos >>Campo<<) e executa rollout / reject / rollback
# Atenção: workflows com trigger `issues` só rodam a partir da branch default (main).
on:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  parse-form:
    if: >-
      (contains(github.event.issue.labels.*.name, 'canary') || contains(github.event.issue.labels.*.name, 'rollback'))
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.parse.outputs.action }}
      environment: ${{ steps.parse.outputs.environment }}
      version: ${{ steps.parse.outputs.version }}
      gmud: ${{ steps.parse.outputs.gmud }}
      branch: ${{ steps.parse.outputs.branch }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # Corpo da issue é input não confiável: só via env, lido como "$BODY" no shell
      BODY: ${{ github.event.issue.body }}
      LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
      AUTHOR: ${{ github.event.issue.user.login }}
      ASSOC: ${{ github.event.issue.author_association }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: parse
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "⏳ Acompanhe a execução: $RUN_URL"
          # Erro de preenchimento: explica na issue e fecha (o gatilho é a abertura; corrigir = abrir outra)
          fail() {
            gh issue comment "$ISSUE_NUMBER" --body "❌ $1

          Nada foi executado. Abra uma nova issue com os dados corrigidos."
            gh issue close "$ISSUE_NUMBER" --reason "not planned" >/dev/null || true
            echo "reported=true" >> "$GITHUB_OUTPUT"; exit 1
          }
          # Só quem tem escrita no repo executa (não usa author_association: em org com
          # participação privada ela não vem como MEMBER)
          PERM=$(gh api "repos/$GH_REPO/collaborators/$AUTHOR/permission" -q .permission 2>/dev/null || echo none)
          echo "autor=$AUTHOR author_association=$ASSOC permissão=$PERM"
          case "$PERM" in admin|write) ;; *) fail "@$AUTHOR não tem permissão de escrita neste repo para executar canary/rollback." ;; esac

          # Campos no formato ### >>Campo<< (delimitadores >> e <<)
          field() { awk -v k=">>$1<<" '$0=="### "k{f=1;next} /^### /{f=0} f' <<<"$BODY" | sed '/^[[:space:]]*$/d' | head -c 200 | tr -d '\r' | head -1; }

          ENVIRONMENT=$(field Ambiente)
          VERSION=$(field Versao)
          GMUD=$(field GMUD)
          [ "$GMUD" = "_No response_" ] && GMUD=""
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]{1,64}$ ]] || fail "Versao inválida."
          [[ -z "$GMUD" || "$GMUD" =~ ^[A-Za-z0-9._-]{1,32}$ ]] || fail "GMUD inválida."

          case ",$LABELS," in
            *,rollback,*)
              ACTION=rollback
              case "$ENVIRONMENT" in hom|prod) ;; *) fail "Rollback só é permitido em hom ou prod." ;; esac ;;
            *,canary,*)
              ACTION=$(field Acao)
              case "$ACTION" in rollout|reject) ;; *) fail "Campo Acao deve ser rollout ou reject." ;; esac
              case "$ENVIRONMENT" in dev|hom|prod) ;; *) fail "Ambiente inválido." ;; esac ;;
            *) fail "Issue sem label canary/rollback." ;;
          esac

          # Ref de onde ler o .advpipes.yml: release/<ver> enquanto existir; depois da tag final a branch
          # é removida, então usa a tag v<ver> (ou o -rc)
          [ "$ENVIRONMENT" != "prod" ] || [ -n "$GMUD" ] || fail "O campo **GMUD** é obrigatório quando o Ambiente é \`prod\`."

          if [ "$ENVIRONMENT" = "dev" ]; then
            BRANCH=develop
          elif gh api "repos/$GH_REPO/git/ref/heads/release/$VERSION" >/dev/null 2>&1; then
            BRANCH="release/$VERSION"
          elif gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            BRANCH="v$VERSION"
          elif gh api "repos/$GH_REPO/git/ref/tags/v$VERSION-rc" >/dev/null 2>&1; then
            BRANCH="v$VERSION-rc"
          else
            fail "Versão $VERSION não encontrada (sem branch release/$VERSION nem tag v$VERSION)."
          fi
          {
            echo "action=$ACTION"
            echo "environment=$ENVIRONMENT"
            echo "version=$VERSION"
            echo "gmud=$GMUD"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg a "$ACTION" --arg e "$ENVIRONMENT" --arg v "$VERSION" --arg g "$GMUD" --arg b "$BRANCH" \
            '{action:$a, environment:$e, versao:$v, gmud:$g, branch:$b}'

  config:
    needs: parse-form
    uses: ./.github/workflows/config.yml
    with:
      environment: ${{ needs.parse-form.outputs.environment }}
      ref: ${{ needs.parse-form.outputs.branch }}

  validate:
    needs: [parse-form, config]
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ needs.parse-form.outputs.environment }}
      GMUD: ${{ needs.parse-form.outputs.gmud }}
    steps:
      - run: |
          if [ "$TARGET_ENV" = "prod" ]; then
            [ -n "$GMUD" ] || { echo "::error::GMUD obrigatória para PROD"; exit 1; }
            echo "✅ [SIMULADO] GMUD $GMUD validada no ServiceNow"
          else
            echo "Ambiente $TARGET_ENV: validação de GMUD não exigida"
          fi

  rollout-reject:
    needs: [parse-form, config, validate]
    if: ${{ needs.parse-form.outputs.action == 'rollout' || needs.parse-form.outputs.action == 'reject' }}
    uses: ./.github/workflows/deploy.yml
    with:
      advpipes: ${{ needs.config.outputs.advpipes }}
      environment: ${{ needs.parse-form.outputs.environment }}
      version: ${{ needs.parse-form.outputs.version }}
      deploy-type: ${{ needs.parse-form.outputs.action }}
      change-id: ${{ needs.parse-form.outputs.gmud }}

  rollback:
    needs: [parse-form, config, validate]
    if: ${{ needs.parse-form.outputs.action == 'rollback' }}
    uses: ./.github/workflows/deploy.yml
    with:
      advpipes: ${{ needs.config.outputs.advpipes }}
      environment: ${{ needs.parse-form.outputs.environment }}
      version: ${{ needs.parse-form.outputs.version }}
      rollback: true
      change-id: ${{ needs.parse-form.outputs.gmud }}

  report-failure:
    needs: [parse-form, config, validate, rollout-reject, rollback]
    if: ${{ failure() && needs.parse-form.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ A execução falhou. Detalhes: $RUN_URL"

  close-issue:
    needs: [parse-form, rollout-reject, rollback]
    if: ${{ !failure() && !cancelled() && (needs.rollout-reject.result == 'success' || needs.rollback.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ACTION: ${{ needs.parse-form.outputs.action }}
      TARGET_ENV: ${{ needs.parse-form.outputs.environment }}
      VERSION: ${{ needs.parse-form.outputs.version }}
    steps:
      - run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Sucesso: **$ACTION** executado em \`$TARGET_ENV\` para a versão \`$VERSION\` (simulado)."
          gh issue close "$ISSUE_NUMBER"
