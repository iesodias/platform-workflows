name: gitflow-deploy

# PR fechado em develop (DEV) ou release/** (HOM): se mergeado, build + deploy simulado
on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      environment:
        description: "dev | hom"
        type: string
        required: true
      open-next-pr:
        description: "Após o deploy, abre PR develop -> pre-release (usar só no DEV)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/gitflow-build.yml
    with:
      stack: ${{ inputs.stack }}

  deploy:
    needs: build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Deploy simulado
        env:
          TARGET_ENV: ${{ inputs.environment }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0-${SHA::7}")
          echo "🚀 [SIMULADO] Deploy em ${TARGET_ENV^^}"
          echo "   versão : $VERSION"
          echo "   commit : $SHA"
          echo "   origem : $PR_TITLE"

  next-pr:
    needs: deploy
    if: github.event.pull_request.merged == true && inputs.open-next-pr
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      # PAT para o PR disparar outros workflows (GITHUB_TOKEN não encadeia)
      GH_TOKEN: ${{ secrets.CI_PAT || github.token }}
    steps:
      - name: Abre PR develop -> pre-release
        run: |
          if [ -n "$(gh pr list --head develop --base pre-release --state open --json number -q '.[0].number')" ]; then
            echo "PR develop -> pre-release já existe"
            exit 0
          fi
          gh pr create --base pre-release --head develop \
            --title "develop -> pre-release" \
            --body "Preparação da release: mergear aciona o workflow 2.5, que cria release/<versão>." \
            || echo "::notice::Sem diferenças entre develop e pre-release (ou PR não pôde ser criado)"
