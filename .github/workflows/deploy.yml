name: deploy

# Deploy simulado por ambiente, rollout/reject de canary e rollback
on:
  workflow_call:
    inputs:
      advpipes:
        type: string
        required: true
      environment:
        description: "dev | hom | prod"
        type: string
        required: true
      version:
        type: string
        required: true
      deploy-type:
        description: "deploy | rollout | reject"
        type: string
        default: deploy
      rollback:
        type: boolean
        default: false
      change-id:
        description: "GMUD associada (prod)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      DEPLOY_TYPE: ${{ inputs.deploy-type }}
      ROLLBACK: ${{ inputs.rollback }}
      CHANGE_ID: ${{ inputs.change-id }}
      CLUSTER: ${{ fromJSON(inputs.advpipes).cluster }}
      NAMESPACE: ${{ fromJSON(inputs.advpipes).namespace }}
      PERCENTAGE: ${{ fromJSON(inputs.advpipes).percentage }}
      DEPLOY_KIND: ${{ fromJSON(inputs.advpipes).deployK8sDeploymentType }}
    steps:
      - name: Deploy simulado
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]{1,64}$ ]] || { echo "::error::Versão inválida"; exit 1; }
          echo "☸️  cluster=$CLUSTER namespace=$NAMESPACE tipo=$DEPLOY_KIND ambiente=${TARGET_ENV^^} versão=$VERSION ${CHANGE_ID:+GMUD=$CHANGE_ID}"
          if [ "$ROLLBACK" = "true" ]; then
            # versão de destino = maior release final abaixo da versão revertida
            PREV=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' | { cat; echo "$VERSION"; } \
              | sort -V | uniq | awk -v v="$VERSION" '$0 == v { print p; exit } { p = $0 }')
            echo "⏪ [SIMULADO] rollback da versão $VERSION em ${TARGET_ENV^^}: kubectl rollout undo deployment/app -n $NAMESPACE (volta para: ${PREV:+v}${PREV:-n/a})"
            exit 0
          fi
          case "$DEPLOY_TYPE" in
            deploy)
              if [ "$TARGET_ENV" = "prod" ]; then
                echo "🐤 [SIMULADO] deploy canary ${PERCENTAGE}% da versão $VERSION — aguardando rollout/reject via Issue"
              else
                echo "🚀 [SIMULADO] helm upgrade app --version $VERSION -n $NAMESPACE (${TARGET_ENV^^})"
              fi ;;
            rollout) echo "✅ [SIMULADO] rollout: 100% do tráfego para $VERSION em ${TARGET_ENV^^}" ;;
            reject)  echo "🛑 [SIMULADO] reject: tráfego volta 100% para a versão anterior em ${TARGET_ENV^^}" ;;
            *) echo "::error::deploy-type inválido: $DEPLOY_TYPE"; exit 1 ;;
          esac
