name: gitflow-hotfix

# push em hotfix/**: pipeline direto para PROD (simulado), pulando o ciclo completo
on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/gitflow-build.yml
    with:
      stack: ${{ inputs.stack }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Hotfix simulado em PROD
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0-${SHA::7}")
          echo "🔥 [SIMULADO] HOTFIX direto em PROD"
          echo "   branch : $BRANCH"
          echo "   versão : $VERSION-hotfix"
          echo "   commit : $SHA"
          echo "   lembrete: abrir PR $BRANCH -> main e depois backmerge para develop"

  open-pr:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.CI_PAT || github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Abre PR hotfix -> main
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')" ]; then
            echo "PR $BRANCH -> main já existe"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Hotfix: $BRANCH" \
            --body $'Hotfix já aplicado em PROD (simulado). Mergear para registrar na main; o backmerge para develop é aberto pelo workflow 5.' \
            || echo "::notice::Não foi possível abrir o PR (sem diferenças em relação à main?)"
