name: publish

# "Registry" de pacotes simulado. Build once, promote many:
#  - mode=upload : empacota UMA vez, guarda no artifact e num GitHub Release pre-release v<ver>-rc
#  - mode=promote: baixa o MESMO asset do Release e verifica o sha256 (nunca rebuilda)
on:
  workflow_call:
    inputs:
      mode:
        description: "upload | promote"
        type: string
        required: true
      advpipes:
        type: string
        required: true
      environment:
        description: "ambiente de destino (dev|hom|prod|hotfix)"
        type: string
        default: ""
      version:
        description: "versão do artefato (obrigatória em promote; em upload vazio = última tag do repo + 1)"
        type: string
        default: ""
      ref:
        type: string
        default: ""
    outputs:
      artifact-version:
        value: ${{ jobs.publish.outputs.version }}
      sha256:
        value: ${{ jobs.publish.outputs.sha256 }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      VERSION_IN: ${{ inputs.version }}
      TARGET_ENV: ${{ inputs.environment }}
      BUILD_DIR: ${{ fromJSON(inputs.advpipes).buildWorkingDirectory }}
      SHA: ${{ inputs.ref || github.sha }}
    steps:
      - if: inputs.mode == 'upload'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: pkg
        name: Empacota / promove
        run: |
          set -euo pipefail
          VERSION="${VERSION_IN:-}"
          if [ "$MODE" = "upload" ] && [ -z "$VERSION" ]; then
            # Re-execução do mesmo commit reutiliza a versão já publicada (idempotente)
            VERSION=$(gh api "repos/$GH_REPO/releases?per_page=100" \
              -q ".[] | select(.tag_name | endswith(\"-rc\")) | select(.target_commitish == \"$SHA\") | .tag_name" \
              | head -1 | sed -e 's/^v//' -e 's/-rc$//')
            if [ -z "$VERSION" ]; then
              # Versão única por repo: maior tag vX.Y.Z (final ou -rc) + 1 no patch
              LAST=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate -q '.[].ref' \
                | sed 's#^refs/tags/v##' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-rc)?$' || true; } \
                | sed 's/-rc$//' | sort -V | tail -1)
              if [ -z "$LAST" ]; then
                VERSION=1.0.0
              else
                IFS=. read -r MAJOR MINOR PATCH <<<"$LAST"
                VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              fi
            fi
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]{1,64}$ ]] || { echo "::error::Versão inválida: '$VERSION'"; exit 1; }
          TAG="v$VERSION-rc"

          case "$MODE" in
            upload)
              tar czf pkg.tgz --exclude=node_modules --exclude=target --exclude=.git -C "$BUILD_DIR" .
              sha256sum pkg.tgz | awk '{print $1"  pkg.tgz"}' > pkg.tgz.sha256
              SUM=$(cut -d' ' -f1 pkg.tgz.sha256)
              if gh release view "$TAG" >/dev/null 2>&1; then
                EXISTING=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)
                if [ "$EXISTING" != "$SHA" ]; then
                  echo "::error::Release $TAG já existe para outro commit ($EXISTING); colisão de versão — o pacote não será reaproveitado"
                  exit 1
                fi
                mkdir -p dl && gh release download "$TAG" -D dl -p pkg.tgz -p pkg.tgz.sha256
                cp dl/pkg.tgz dl/pkg.tgz.sha256 . && SUM=$(cut -d' ' -f1 pkg.tgz.sha256)
                echo "::notice::Release $TAG já existe para este commit; pacote reaproveitado (build once)"
              else
                gh release create "$TAG" pkg.tgz pkg.tgz.sha256 --prerelease --target "$SHA" \
                  --title "$VERSION (rc)" --notes "Pacote $VERSION — sha256 \`$SUM\` (build único; promovido entre ambientes sem rebuild)."
              fi
              echo "📦 [UPLOAD] pacote $VERSION  sha256=$SUM  → Release $TAG"
              ;;
            promote)
              [ -n "$VERSION" ] || { echo "::error::version obrigatória em promote"; exit 1; }
              mkdir -p dl && gh release download "$TAG" -D dl -p pkg.tgz -p pkg.tgz.sha256
              (cd dl && sha256sum -c pkg.tgz.sha256)
              SUM=$(cut -d' ' -f1 dl/pkg.tgz.sha256)
              echo "🔁 [PROMOTE] artefato $VERSION promovido para ${TARGET_ENV^^} sem rebuild — sha256=$SUM (verificado)"
              ;;
            *) echo "::error::mode inválido: $MODE"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"

      - if: inputs.mode == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.pkg.outputs.version }}
          path: pkg.tgz*
