name: publish

# "Registry" de pacotes simulado. Build once, promote many:
#  - mode=upload : empacota UMA vez, guarda no artifact e num GitHub Release pre-release v<ver>-rc
#  - mode=promote: baixa o MESMO asset do Release e verifica o sha256 (nunca rebuilda)
on:
  workflow_call:
    inputs:
      mode:
        description: "upload | promote"
        type: string
        required: true
      iupipes:
        type: string
        required: true
      environment:
        description: "ambiente de destino (dev|hom|prod|hotfix)"
        type: string
        default: ""
      version:
        description: "versão do artefato (obrigatória em promote; em upload vazio = 1.0.<run_number>)"
        type: string
        default: ""
      ref:
        type: string
        default: ""
    outputs:
      artifact-version:
        value: ${{ jobs.publish.outputs.version }}
      sha256:
        value: ${{ jobs.publish.outputs.sha256 }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      VERSION_IN: ${{ inputs.version }}
      TARGET_ENV: ${{ inputs.environment }}
      BUILD_DIR: ${{ fromJSON(inputs.iupipes).buildWorkingDirectory }}
      RUN_NUMBER: ${{ github.run_number }}
      SHA: ${{ github.sha }}
    steps:
      - if: inputs.mode == 'upload'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: pkg
        name: Empacota / promove
        run: |
          set -euo pipefail
          VERSION="${VERSION_IN:-}"
          if [ "$MODE" = "upload" ]; then
            [ -n "$VERSION" ] || VERSION="1.0.$RUN_NUMBER"
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]{1,64}$ ]] || { echo "::error::Versão inválida: '$VERSION'"; exit 1; }
          TAG="v$VERSION-rc"

          case "$MODE" in
            upload)
              tar czf pkg.tgz --exclude=node_modules --exclude=target --exclude=.git -C "$BUILD_DIR" .
              sha256sum pkg.tgz | awk '{print $1"  pkg.tgz"}' > pkg.tgz.sha256
              SUM=$(cut -d' ' -f1 pkg.tgz.sha256)
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "::notice::Release $TAG já existe; pacote não é sobrescrito (build once)"
              else
                gh release create "$TAG" pkg.tgz pkg.tgz.sha256 --prerelease --target "$SHA" \
                  --title "$VERSION (rc)" --notes "Pacote $VERSION — sha256 \`$SUM\` (build único; promovido entre ambientes sem rebuild)."
              fi
              echo "📦 [UPLOAD] pacote $VERSION  sha256=$SUM  → Release $TAG"
              ;;
            promote)
              [ -n "$VERSION" ] || { echo "::error::version obrigatória em promote"; exit 1; }
              mkdir -p dl && gh release download "$TAG" -D dl -p pkg.tgz -p pkg.tgz.sha256
              (cd dl && sha256sum -c pkg.tgz.sha256)
              SUM=$(cut -d' ' -f1 dl/pkg.tgz.sha256)
              echo "🔁 [PROMOTE] artefato $VERSION promovido para ${TARGET_ENV^^} sem rebuild — sha256=$SUM (verificado)"
              ;;
            *) echo "::error::mode inválido: $MODE"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"

      - if: inputs.mode == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.pkg.outputs.version }}
          path: pkg.tgz*
