name: gitflow-prerelease

# push em pre-release: cria release/<versão> a partir de pre-release
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      # PAT para o PR disparar outros workflows (GITHUB_TOKEN não encadeia)
      PR_TOKEN: ${{ secrets.CI_PAT || github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Cria release/<versão>
        run: |
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" -q .object.sha)
          if [ "$MAIN_SHA" = "$SHA" ]; then
            echo "::notice::pre-release idêntica à main; nada a liberar"
            exit 0
          fi
          VERSION=$(cat VERSION 2>/dev/null | head -1 | tr -d '[:space:]' || true)
          [ -n "$VERSION" ] || VERSION="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]{1,64}$ ]] || { echo "::error::Versão inválida: $VERSION"; exit 1; }

          if gh api "repos/$GH_REPO/git/ref/heads/release/$VERSION" >/dev/null 2>&1; then
            echo "::notice::release/$VERSION já existe; nada a fazer"
            exit 0
          fi
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/release/$VERSION" -f sha="$SHA" >/dev/null
          echo "✅ Criada branch release/$VERSION a partir de pre-release ($SHA)"

          # Abre PR release/<versão> -> main com o checkbox de aprovação do deploy em PROD
          BODY=$'Release '"$VERSION"$'\n\n- [ ] Aprovar deploy em PROD\n\nEdite este PR marcando o checkbox para aprovar o deploy em PROD.'
          if [ -n "$(GH_TOKEN=$PR_TOKEN gh pr list --head "release/$VERSION" --base main --state open --json number -q '.[0].number')" ]; then
            echo "PR release/$VERSION -> main já existe"
          else
            GH_TOKEN=$PR_TOKEN gh pr create --base main --head "release/$VERSION" \
              --title "Release $VERSION" --body "$BODY" \
              || echo "::warning::Não foi possível abrir o PR release/$VERSION -> main"
          fi
