name: ci

# Build + testes, conforme project.language do .advpipes.yml (ts | java-maven | infra)
on:
  workflow_call:
    inputs:
      advpipes:
        type: string
        required: true
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      LANGUAGE: ${{ fromJSON(inputs.advpipes).projectLanguage }}
      BUILD_DIR: ${{ fromJSON(inputs.advpipes).buildWorkingDirectory }}
      TEST_DIR: ${{ fromJSON(inputs.advpipes).testWorkingDirectory || fromJSON(inputs.advpipes).buildWorkingDirectory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - if: env.LANGUAGE == 'ts'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJSON(inputs.advpipes).buildNodeVersion || '20' }}
          cache: npm
          cache-dependency-path: ${{ fromJSON(inputs.advpipes).buildWorkingDirectory }}/package-lock.json

      - if: env.LANGUAGE == 'java-maven'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ fromJSON(inputs.advpipes).buildJavaVersion || '21' }}
          cache: maven

      - name: Build
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          case "$LANGUAGE" in
            ts)         npm ci && npm run build --if-present ;;
            java-maven) mvn -B -ntp -DskipTests package ;;
            infra)
              if command -v terraform >/dev/null; then
                terraform fmt -check -recursive && terraform init -input=false -backend=false && terraform validate
              else
                echo "[SIMULADO] terraform não disponível no runner; build de infra simulado"
              fi ;;
            *) echo "::error::project.language desconhecido: $LANGUAGE"; exit 1 ;;
          esac

      - name: Test
        working-directory: ${{ env.TEST_DIR }}
        run: |
          case "$LANGUAGE" in
            ts)         npm test --if-present ;;
            java-maven) mvn -B -ntp test ;;
            infra)      echo "[SIMULADO] testes de infra" ;;
          esac
