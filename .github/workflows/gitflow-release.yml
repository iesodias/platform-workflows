name: gitflow-release

# PR mergeado em main: cria a tag da versão e abre PR de backmerge main -> develop
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      # PAT para o PR de backmerge disparar os workflows de develop
      GH_TOKEN: ${{ secrets.CI_PAT || github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag da versão
        run: |
          if [[ "$HEAD_REF" == release/* ]]; then
            VERSION="${HEAD_REF#release/}"
          else
            VERSION=$(cat VERSION 2>/dev/null | head -1 | tr -d '[:space:]' || true)
            [ -n "$VERSION" ] || VERSION="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]{1,64}$ ]] || { echo "::error::Versão inválida: $VERSION"; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Tag v$VERSION já existe"
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$MERGE_SHA" >/dev/null
            echo "🏷️  Tag v$VERSION criada em $MERGE_SHA"
          fi
      - name: Backmerge main -> develop (via PR)
        run: |
          if [ -n "$(gh pr list --head main --base develop --state open --json number -q '.[0].number')" ]; then
            echo "PR de backmerge já aberto"
            exit 0
          fi
          if gh pr create --base develop --head main \
              --title "Backmerge main -> develop" \
              --body "Backmerge automático após release em PROD."; then
            echo "✅ PR de backmerge aberto"
          else
            echo "::notice::Sem diferenças entre main e develop (ou PR não pôde ser criado)"
          fi
